[project]
name = "group-consensus"
version = "0.1.0"
description = "AI-mediated group consensus platform combining deliberation AI with opinion clustering"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andy7475" }]

dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "scikit-learn>=1.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.24.0",
    "httpx>=0.28.0",
    "nest-asyncio>=1.6.0",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "umap-learn>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "jupyter>=1.1.0",
    "nbformat>=5.10.0",
    "pre-commit>=4.6.0",
    "nbstripout>=0.9.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
